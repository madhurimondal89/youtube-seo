version: "3.8"

# =================================================================
# TubePilot AI — Coolify & Traefik Production Docker Compose
# Target Host: Hostinger KVM 4 VPS (Ubuntu)
# Target Domain: seo.freeyoutubetools.com
#
# Production Hardening Highlights:
# - Strict Secret Enforcement: Fails startup if SECRET_KEY is missing/empty
# - Zero host port collisions: NO ports 80/443 or 8000 bound on host
# - Backend port 8000 is internal-only (never exposed publicly)
# - Host Gateway Integration: 'host.docker.internal:11434' reaches host Ollama
# - Optional Companion Ollama Service (profile: local-ai)
# - Next.js rewrites proxy /api requests to backend:8000 internally
# - Persistent SQLite storage mapped to Docker named volume
# =================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tubepilot_backend
    restart: unless-stopped
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in environment}
      - DATABASE_URL=sqlite:///./data/youtube_seo.db
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-60}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - LOCALAI_BASE_URL=${LOCALAI_BASE_URL:-http://host.docker.internal:8080/v1}
      - LOCALAI_MODEL=${LOCALAI_MODEL:-gpt-4}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-local-model}
      - CUSTOM_AI_BASE_URL=${CUSTOM_AI_BASE_URL:-}
      - CUSTOM_AI_MODEL=${CUSTOM_AI_MODEL:-}
      - CUSTOM_AI_API_KEY=${CUSTOM_AI_API_KEY:-}
      - YOUTUBE_PROVIDER=${YOUTUBE_PROVIDER:-public}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - CACHE_ENABLED=true
      - CACHE_TTL_SECONDS=900
    volumes:
      - tubepilot_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - coolify
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tubepilot_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tubepilot-frontend.rule=Host(`seo.freeyoutubetools.com`)"
      - "traefik.http.routers.tubepilot-frontend.entrypoints=https"
      - "traefik.http.routers.tubepilot-frontend.tls=true"
      - "traefik.http.routers.tubepilot-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.tubepilot-frontend.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M

  # Optional companion Ollama container for users wanting isolated containerized AI
  ollama:
    image: ollama/ollama:latest
    container_name: tubepilot_ollama
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    networks:
      - coolify
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: 8192M

volumes:
  tubepilot_data:
  ollama_models:

networks:
  coolify:
    external: true
